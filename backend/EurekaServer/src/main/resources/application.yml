server:
  port: 8761
  address: 0.0.0.0

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eureka-server
    prefer-ip-address: true

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://eureka-server:8761/eureka

# -------------------
# Actuator config phải ngoài eureka
management:
  endpoints:
    web:
      exposure:
        include: "*"
